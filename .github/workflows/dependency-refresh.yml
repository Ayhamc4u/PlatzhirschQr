name: Refresh dependencies once

on:
  push:
    branches:
      - refactor/platzhirsch-core
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refactor/platzhirsch-core

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm --version

      - name: Update dependencies
        run: |
          pnpm update --latest
          pnpm add -D @types/node@^22

      - name: Commit refreshed manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Dependencies already current."
          else
            git commit -m "refresh project dependencies"
            git push origin HEAD:refactor/platzhirsch-core
          fi

      - name: Verify build with refreshed dependencies
        run: pnpm build
